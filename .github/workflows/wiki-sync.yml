name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Sync Wiki Directory to GitHub Wiki Repository
        env:
          WIKI_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Syncing wiki files to repository wiki..."
          WIKI_URL="https://x-access-token:${WIKI_PAT}@github.com/${{ github.repository }}.wiki.git"
          
          # Test if the wiki git repository is initialized
          if git clone "$WIKI_URL" wiki_repo; then
            echo "Wiki repository cloned successfully."
            cd wiki_repo
            
            # Configure git author
            git config user.name "Erebus"
            git config user.email "kshitiz23kumar@gmail.com"
            
            # Copy all files from wiki/ into wiki_repo/
            rm -rf ./*
            cp -r ../wiki/* .
            
            # Commit and push if there are changes
            git add .
            if git status --porcelain | grep -q .; then
              git commit -m "Update wiki documentation from main branch"
              git push origin master
              echo "Wiki synchronized successfully."
            else
              echo "No wiki changes detected. Wiki is up to date."
            fi
          else
            echo "Wiki git repository not initialized yet."
            echo "To initialize, open https://github.com/${{ github.repository }}/wiki in your browser and click 'Create the first page'."
            echo "Once initialized, this workflow will automatically synchronize all wiki content."
          fi
